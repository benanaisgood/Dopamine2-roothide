name: "Build Dopamine 2.4.5.18 IPA"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout upstream tag 18
        run: |
          set -euxo pipefail
          git clone --branch 18 --single-branch --recursive \
            https://github.com/roothide/Dopamine2-roothide \
            "${GITHUB_WORKSPACE}"
          test "$(git rev-parse HEAD)" = "a0acfc08d9f3f527f63e6e17945f1075480edcb4"

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install Theos and iPhoneOS 16.5 SDK
        run: |
          set -euxo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p "${THEOS}"
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos > install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            --output "${THEOS}/sdks/iPhoneOS16.5.sdk.tar.xz"
          gunzip "${THEOS}/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "${THEOS}/sdks/iPhoneOS16.5.sdk.tar" -C "${THEOS}/sdks"
          rm "${THEOS}/sdks/iPhoneOS16.5.sdk.tar"

      - name: Build and install trustcache
        run: |
          set -euxo pipefail
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.physicalcpu)" OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Install libarchive
        run: brew install libarchive

      - name: Build exact tag and create IPA alias
        run: |
          set -euxo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          rm -rf "$(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc" \
            "$(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc.modulemap"
          gmake -j"$(sysctl -n hw.physicalcpu)"
          test -s ./Application/Dopamine.tipa
          cp ./Application/Dopamine.tipa ./Application/Dopamine-2.4.5.18.ipa
          unzip -t ./Application/Dopamine-2.4.5.18.ipa
          shasum -a 256 ./Application/Dopamine.tipa ./Application/Dopamine-2.4.5.18.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-2.4.5.18-ipa
          path: ${{ github.workspace }}/Application/Dopamine-2.4.5.18.ipa
          if-no-files-found: error
